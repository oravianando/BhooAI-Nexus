# BhooAI Nexus — Node ↔ Python AI service contract.
# Single source of truth for the AI boundary. The Python FastAPI server
# implements these endpoints; the Node @bhooai/nexus-ai-client is typed from
# them. The browser never talks to Python directly — Node proxies/re-emits SSE.
#
# The API is OpenAI-compatible (chat completions + embeddings + models) with an
# optional `provider` field ("openai" | "ollama" | "auto") to route a request.
openapi: 3.1.0
info:
  title: BhooAI Nexus AI
  version: 1.0.0
  description: OpenAI-compatible AI gateway fronting OpenAI and Ollama.
servers:
  - url: http://localhost:8000
paths:
  /health:
    get:
      summary: Liveness probe.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  providers:
                    type: array
                    items: { type: string }
  /chat/completions:
    post:
      summary: Create a chat completion (streaming or not).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatCompletionRequest' }
      responses:
        '200':
          description: A chat completion (JSON) or an SSE stream of chunks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatCompletionResponse' }
            text/event-stream:
              schema: { $ref: '#/components/schemas/ChatCompletionChunk' }
  /embeddings:
    post:
      summary: Create embeddings for one or more inputs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmbeddingRequest' }
      responses:
        '200':
          description: Embedding vectors.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmbeddingResponse' }
  /models:
    get:
      summary: List available models.
      parameters:
        - in: query
          name: provider
          schema: { $ref: '#/components/schemas/Provider' }
      responses:
        '200':
          description: Model list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelsResponse' }
components:
  schemas:
    Provider:
      type: string
      enum: [openai, ollama, auto]
    Role:
      type: string
      enum: [system, user, assistant, tool]
    Message:
      type: object
      required: [role, content]
      properties:
        role: { $ref: '#/components/schemas/Role' }
        content: { type: string }
        name: { type: string }
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model: { type: string }
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        stream: { type: boolean, default: false }
        temperature: { type: number }
        max_tokens: { type: integer }
        provider: { $ref: '#/components/schemas/Provider' }
    Choice:
      type: object
      properties:
        index: { type: integer }
        message: { $ref: '#/components/schemas/Message' }
        finish_reason: { type: string }
    ChatCompletionResponse:
      type: object
      properties:
        id: { type: string }
        model: { type: string }
        provider: { type: string }
        choices:
          type: array
          items: { $ref: '#/components/schemas/Choice' }
        usage:
          type: object
          properties:
            prompt_tokens: { type: integer }
            completion_tokens: { type: integer }
            total_tokens: { type: integer }
    Delta:
      type: object
      properties:
        role: { $ref: '#/components/schemas/Role' }
        content: { type: string }
    ChunkChoice:
      type: object
      properties:
        index: { type: integer }
        delta: { $ref: '#/components/schemas/Delta' }
        finish_reason: { type: string, nullable: true }
    ChatCompletionChunk:
      type: object
      properties:
        id: { type: string }
        model: { type: string }
        provider: { type: string }
        choices:
          type: array
          items: { $ref: '#/components/schemas/ChunkChoice' }
    EmbeddingRequest:
      type: object
      required: [model, input]
      properties:
        model: { type: string }
        input:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
        provider: { $ref: '#/components/schemas/Provider' }
    EmbeddingData:
      type: object
      properties:
        index: { type: integer }
        embedding:
          type: array
          items: { type: number }
    EmbeddingResponse:
      type: object
      properties:
        model: { type: string }
        provider: { type: string }
        data:
          type: array
          items: { $ref: '#/components/schemas/EmbeddingData' }
        usage:
          type: object
          properties:
            prompt_tokens: { type: integer }
            total_tokens: { type: integer }
    ModelsResponse:
      type: object
      properties:
        provider: { type: string }
        data:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              owned_by: { type: string }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            message: { type: string }
            type: { type: string }
            code: { type: string }