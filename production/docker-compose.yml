name: bhooai-nexus

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai:
    build:
      context: .
      dockerfile: Dockerfile.ai
    restart: unless-stopped
    env_file: .env
    environment:
      AI_PORT: 8000
      AI_CORS_ORIGINS: "${AI_CORS_ORIGINS:-*}"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  nexus:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NEXUS_ENV: production
      NEXUS_SERVER_HOST: 0.0.0.0
      NEXUS_SERVER_PORT: 4000
      NEXUS_FRONTEND_HOST: 0.0.0.0
      NEXUS_FRONTEND_PORT: 3000
      NEXUS_ADMIN_HOST: 0.0.0.0
      NEXUS_ADMIN_PORT: 3001
      NEXUS_DB_URI: mongodb://mongo:27017/nexus
      NEXUS_REDIS_URL: redis://redis:6379
      NEXUS_AI_SERVER_URL: http://ai:8000
      NEXUS_NODE_PORT: 7575
    volumes:
      - nexus-uploads:/app/uploads
      - nexus-certs:/app/certs
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy
    expose:
      - "3000"
      - "3001"
      - "4000"
      - "7575"

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/docker-entrypoint.d/10-ensure-certs.sh:/docker-entrypoint.d/10-ensure-certs.sh:ro
      - ./nginx/ssl:/etc/nginx/ssl:rw
      - ./nginx/webroot:/usr/share/nginx/html:ro
    entrypoint: ["sh", "-c", "sh /docker-entrypoint.d/10-ensure-certs.sh && exec /docker-entrypoint.sh nginx -g 'daemon off;'"]
    depends_on:
      - nexus
      - ai

volumes:
  mongo-data:
  redis-data:
  nexus-uploads:
  nexus-certs:
