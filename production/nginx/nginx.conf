# BhooAI Nexus - production reverse proxy.
#
#   bhooai.com       -> frontend SPA (:3000)  + API paths proxied to backend (:4000)
#   admin.bhooai.com -> admin SPA (:3001)     + API paths proxied to backend (:4000)
#
# SSL certs are mounted from ./nginx/ssl/fullchain.pem + privkey.pem. The
# docker-entrypoint.d/10-ensure-certs.sh generates a self-signed bootstrap pair
# on first start so nginx always opens :80/:443; drop in real Let's Encrypt
# certs later (certbot certonly --webroot ...) and reload.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# ---------------------------------------------------------------- http :80 ---
# Serves ACME challenges and redirects to https once the site is reachable.

server {
  listen 80 default_server;
  server_name bhooai.com admin.bhooai.com;

  location /.well-known/acme-challenge/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# --------------------------------------------------------------- https 443 ---
# bhooai.com -> frontend SPA, API paths -> backend.

server {
  listen 443 ssl;
  server_name bhooai.com;

  ssl_certificate     /etc/nginx/ssl/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  http2 on;

  location /.well-known/acme-challenge/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
  }

  # ---- API + websocket paths -> backend :4000 ----
  location ~ ^/(health|graphql|csrf-token|auth|payments|uploads|docs|ai|ws)(/|$) {
    proxy_pass http://nexus:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  # ---- frontend SPA -> :3000 ----
  location / {
    proxy_pass http://nexus:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# admin.bhooai.com -> admin SPA, API paths -> backend.

server {
  listen 443 ssl;
  server_name admin.bhooai.com;

  ssl_certificate     /etc/nginx/ssl/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  http2 on;

  location /.well-known/acme-challenge/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
  }

  # ---- API + websocket paths -> backend :4000 ----
  location ~ ^/(admin|auth|payments|csrf-token|ai|health|graphql|ws)(/|$) {
    proxy_pass http://nexus:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  # ---- admin SPA -> :3001 ----
  location / {
    proxy_pass http://nexus:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
