<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
  <title id="title">Nexus platform cover</title>
  <desc id="desc">Abstract futuristic network core connecting AI, data, realtime, and payments.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b18"/><stop offset=".55" stop-color="#17245a"/><stop offset="1" stop-color="#35165f"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67e8f9"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#f0abfc"/></linearGradient>
    <radialGradient id="core" cx="50%" cy="50%"><stop stop-color="#fff"/><stop offset=".13" stop-color="#a5f3fc"/><stop offset=".42" stop-color="#818cf8" stop-opacity=".65"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1000" height="760" rx="36" fill="url(#bg)"/>
  <circle cx="220" cy="180" r="150" fill="#22d3ee" opacity=".18" filter="url(#blur)"/>
  <circle cx="800" cy="600" r="190" fill="#c084fc" opacity=".2" filter="url(#blur)"/>
  <g opacity=".16" stroke="#a5f3fc">
    <path d="M0 100h1000M0 220h1000M0 340h1000M0 460h1000M0 580h1000M0 700h1000"/>
    <path d="M100 0v760M220 0v760M340 0v760M460 0v760M580 0v760M700 0v760M820 0v760M940 0v760"/>
  </g>
  <g fill="none" stroke="url(#line)" stroke-width="3" opacity=".7">
    <path d="M500 380 180 160M500 380 820 160M500 380 160 610M500 380 840 610M500 380 500 80M500 380 500 690"/>
    <path d="M500 380 280 320M500 380 720 320M500 380 300 480M500 380 700 480" stroke-dasharray="10 14"/>
  </g>
  <g fill="#071024" stroke="url(#line)" stroke-width="4" filter="url(#glow)">
    <rect x="108" y="108" width="150" height="84" rx="18"/>
    <rect x="742" y="108" width="150" height="84" rx="18"/>
    <rect x="92" y="568" width="170" height="84" rx="18"/>
    <rect x="738" y="568" width="170" height="84" rx="18"/>
    <rect x="425" y="42" width="150" height="76" rx="18"/>
    <rect x="420" y="642" width="160" height="76" rx="18"/>
  </g>
  <g fill="#a5f3fc" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <text x="183" y="158">DATA</text><text x="817" y="158">AI</text><text x="177" y="618">REALTIME</text><text x="823" y="618">PAYMENTS</text><text x="500" y="88">GRAPHQL</text><text x="500" y="688">AUTH</text>
  </g>
  <circle cx="500" cy="380" r="180" fill="url(#core)" opacity=".5"/>
  <circle cx="500" cy="380" r="116" fill="#0b1430" stroke="url(#line)" stroke-width="5" filter="url(#glow)"/>
  <path d="M454 442V318l92 124V318" fill="none" stroke="url(#line)" stroke-linecap="round" stroke-linejoin="round" stroke-width="22"/>
  <circle cx="454" cy="318" r="8" fill="#67e8f9"/><circle cx="546" cy="442" r="8" fill="#f0abfc"/>
  <text x="500" y="535" fill="#dbeafe" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="7" text-anchor="middle">ONE RUNTIME. EVERY SIGNAL.</text>
</svg>
